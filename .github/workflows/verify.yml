name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test Built evidence verifier with local fixtures
        run: pnpm test:evidence

      - name: Test project metadata refresh with local fixtures
        run: pnpm test:projects

      - name: Build production site
        run: pnpm build

      - name: Test image import and auditing
        run: pnpm test:images

      - name: Audit image references and size budgets
        run: pnpm check:images --built

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full production browser and accessibility suite
        run: pnpm test:browser

      - name: Verify project fallbacks and offline build independence
        run: pnpm test:projects:browser

      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
